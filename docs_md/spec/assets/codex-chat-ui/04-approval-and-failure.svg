<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Approval 与最终失败呈现</title>
  <desc id="desc">左侧展示等待审批的内联卡片，右侧展示连接重试耗尽后的恢复操作，说明两组操作互斥。</desc>
  <defs><filter id="s" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#26352e" flood-opacity="0.11"/></filter></defs>
  <rect width="1200" height="760" fill="#eef2ef"/>
  <text x="54" y="54" fill="#203029" font-family="Segoe UI, Microsoft YaHei" font-size="20" font-weight="600">必须操作的状态才提升视觉权重</text>
  <text x="54" y="79" fill="#6e7c74" font-family="Segoe UI, Microsoft YaHei" font-size="12">Approval 与 retry exhausted 都附着在对应 AI message；两种操作不会同时出现</text>

  <g transform="translate(54 112)">
    <rect width="520" height="560" rx="20" fill="#ffffff" filter="url(#s)"/>
    <text x="24" y="34" fill="#7a867f" font-family="Segoe UI, Microsoft YaHei" font-size="11">WAITING APPROVAL</text>
    <rect x="28" y="66" width="28" height="28" rx="9" fill="#17755a"/><text x="42" y="85" text-anchor="middle" fill="#fff" font-family="Segoe UI, Microsoft YaHei" font-size="11">C</text>
    <text x="70" y="84" fill="#22302a" font-family="Segoe UI, Microsoft YaHei" font-size="12" font-weight="600">C-AICLI</text>
    <text x="70" y="125" fill="#22302a" font-family="Segoe UI, Microsoft YaHei" font-size="14">我需要运行一个会修改工作区的命令。</text>
    <rect x="70" y="156" width="414" height="238" rx="14" fill="#fffaf0" stroke="#ddc98e"/>
    <circle cx="98" cy="186" r="12" fill="#f1d98e"/><text x="98" y="191" text-anchor="middle" fill="#6f5616" font-family="Segoe UI, Microsoft YaHei" font-size="14" font-weight="700">!</text>
    <text x="122" y="191" fill="#3a372d" font-family="Segoe UI, Microsoft YaHei" font-size="14" font-weight="600">需要批准</text>
    <text x="94" y="230" fill="#645f50" font-family="Segoe UI, Microsoft YaHei" font-size="11">操作</text><text x="164" y="230" fill="#2d352f" font-family="Consolas, Microsoft YaHei" font-size="11">npm install</text>
    <text x="94" y="260" fill="#645f50" font-family="Segoe UI, Microsoft YaHei" font-size="11">风险</text><text x="164" y="260" fill="#2d352f" font-family="Segoe UI, Microsoft YaHei" font-size="11">访问网络并修改依赖</text>
    <text x="94" y="290" fill="#645f50" font-family="Segoe UI, Microsoft YaHei" font-size="11">目标</text><text x="164" y="290" fill="#2d352f" font-family="Segoe UI, Microsoft YaHei" font-size="11">当前 workspace</text>
    <line x1="94" y1="316" x2="458" y2="316" stroke="#eadfbd"/>
    <rect x="278" y="338" width="84" height="36" rx="9" fill="#ffffff" stroke="#c8cec9"/><text x="320" y="361" text-anchor="middle" fill="#34443c" font-family="Segoe UI, Microsoft YaHei" font-size="11">拒绝</text>
    <rect x="374" y="338" width="84" height="36" rx="9" fill="#17755a"/><text x="416" y="361" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Microsoft YaHei" font-size="11">批准</text>
    <rect x="70" y="426" width="414" height="78" rx="14" fill="#f4f6f4" stroke="#dce2de"/>
    <text x="90" y="454" fill="#88928c" font-family="Segoe UI, Microsoft YaHei" font-size="12">Composer 草稿保留</text>
    <rect x="426" y="444" width="36" height="36" rx="11" fill="#dfe4e1"/><rect x="437" y="455" width="14" height="14" rx="3" fill="#9aa49e"/>
    <text x="90" y="482" fill="#6f7c75" font-family="Segoe UI, Microsoft YaHei" font-size="10">Send disabled · 不显示 Stop/Retry</text>
  </g>

  <g transform="translate(626 112)">
    <rect width="520" height="560" rx="20" fill="#ffffff" filter="url(#s)"/>
    <text x="24" y="34" fill="#7a867f" font-family="Segoe UI, Microsoft YaHei" font-size="11">RETRY EXHAUSTED</text>
    <rect x="28" y="66" width="28" height="28" rx="9" fill="#17755a"/><text x="42" y="85" text-anchor="middle" fill="#fff" font-family="Segoe UI, Microsoft YaHei" font-size="11">C</text>
    <text x="70" y="84" fill="#22302a" font-family="Segoe UI, Microsoft YaHei" font-size="12" font-weight="600">C-AICLI</text>
    <text x="70" y="132" fill="#9b3434" font-family="Segoe UI, Microsoft YaHei" font-size="15" font-weight="600">连接失败，已重试 5 次</text>
    <text x="70" y="165" fill="#5c6962" font-family="Segoe UI, Microsoft YaHei" font-size="12">模型连接在生成回复时多次中断。</text>
    <text x="70" y="190" fill="#5c6962" font-family="Segoe UI, Microsoft YaHei" font-size="12">你的消息和上下文已经保留。</text>
    <rect x="70" y="226" width="106" height="38" rx="10" fill="#17755a"/><text x="123" y="250" text-anchor="middle" fill="#fff" font-family="Segoe UI, Microsoft YaHei" font-size="11">重新尝试</text>
    <rect x="188" y="226" width="130" height="38" rx="10" fill="#fff" stroke="#c8d1cc"/><text x="253" y="250" text-anchor="middle" fill="#34443c" font-family="Segoe UI, Microsoft YaHei" font-size="11">复制错误信息</text>
    <text x="70" y="298" fill="#7a867f" font-family="Segoe UI, Microsoft YaHei" font-size="11">连接失败 · 处理 12.6 秒</text>
    <rect x="70" y="338" width="414" height="70" rx="12" fill="#fff4f4" stroke="#e7c5c5"/>
    <text x="90" y="366" fill="#7e3939" font-family="Segoe UI, Microsoft YaHei" font-size="11">安全边界</text>
    <text x="90" y="389" fill="#665454" font-family="Segoe UI, Microsoft YaHei" font-size="10">若已完成副作用，AppHost 拒绝整 Turn 重放。</text>
    <rect x="70" y="438" width="414" height="66" rx="14" fill="#ffffff" stroke="#ccd6d0"/>
    <text x="90" y="470" fill="#88928c" font-family="Segoe UI, Microsoft YaHei" font-size="12">继续输入…</text>
    <rect x="428" y="452" width="36" height="36" rx="11" fill="#17755a"/><path d="M439 470h13m0 0-5-5m5 5-5 5" stroke="#fff" stroke-width="2" fill="none"/>
    <text x="90" y="492" fill="#6f7c75" font-family="Segoe UI, Microsoft YaHei" font-size="10">Composer 已恢复 Send</text>
  </g>

  <line x1="600" y1="120" x2="600" y2="670" stroke="#bcc7c1" stroke-dasharray="4 6"/>
  <text x="600" y="714" text-anchor="middle" fill="#617068" font-family="Segoe UI, Microsoft YaHei" font-size="11">互斥：Approval 时没有 Stop/Retry；终态失败时没有 Approve/Deny</text>
</svg>
