<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1040" viewBox="0 0 1200 1040" role="img" aria-labelledby="title desc">
  <title id="title">C-AICLI 800×900 窄窗口响应式布局</title>
  <desc id="desc">展示导航和检查器收为互斥抽屉后，主对话与 Composer 如何保持可用。</desc>
  <defs><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#203129" flood-opacity="0.13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#53645d"/></marker></defs>
  <rect width="1200" height="1040" fill="#eef2ef"/>
  <text x="52" y="52" fill="#203029" font-family="Segoe UI, Microsoft YaHei" font-size="20" font-weight="600">800×900 窄窗口：对话优先，面板互斥</text>
  <text x="52" y="76" fill="#6e7c74" font-family="Segoe UI, Microsoft YaHei" font-size="12">左、右面板都变为 drawer；主操作始终保持在可见区域</text>

  <g transform="translate(54 106)">
    <rect width="800" height="900" rx="16" fill="#f5f7f5" stroke="#cdd7d1" filter="url(#s)"/>
    <rect width="800" height="56" rx="16" fill="#ffffff"/><rect y="42" width="800" height="14" fill="#ffffff"/>
    <rect x="16" y="14" width="30" height="30" rx="9" fill="#17755a"/><text x="31" y="35" text-anchor="middle" fill="#fff" font-family="Segoe UI, Microsoft YaHei" font-size="12">C</text>
    <text x="58" y="34" fill="#203029" font-family="Segoe UI, Microsoft YaHei" font-size="13" font-weight="600">C-AICLI</text>
    <rect x="700" y="14" width="36" height="30" rx="9" fill="#f0f4f2"/><path d="M711 23h14M711 29h14M711 35h14" stroke="#53645d" stroke-width="2"/>
    <rect x="746" y="14" width="36" height="30" rx="9" fill="#f0f4f2"/><path d="M757 23h14v12h-14z" fill="none" stroke="#53645d" stroke-width="1.8"/>
    <rect x="0" y="56" width="800" height="50" fill="#ffffff" stroke="#d8dfdb"/>
    <text x="24" y="86" fill="#203029" font-family="Segoe UI, Microsoft YaHei" font-size="14" font-weight="600">连续对话与重试</text>
    <rect x="708" y="68" width="68" height="26" rx="8" fill="#f0f4f2"/><text x="742" y="85" text-anchor="middle" fill="#5e6d65" font-family="Segoe UI, Microsoft YaHei" font-size="10">Activity</text>

    <rect x="24" y="124" width="752" height="626" fill="#fff" opacity="0.42"/>
    <rect x="402" y="146" width="350" height="58" rx="15" fill="#e2f1ea" stroke="#bad9ca"/><text x="728" y="180" text-anchor="end" fill="#22302a" font-family="Segoe UI, Microsoft YaHei" font-size="13">请继续完成 UI 规划</text>
    <rect x="40" y="244" width="24" height="24" rx="8" fill="#17755a"/><text x="52" y="261" text-anchor="middle" fill="#fff" font-family="Segoe UI, Microsoft YaHei" font-size="10">C</text>
    <text x="76" y="260" fill="#22302a" font-family="Segoe UI, Microsoft YaHei" font-size="12" font-weight="600">C-AICLI</text>
    <text x="76" y="302" fill="#22302a" font-family="Segoe UI, Microsoft YaHei" font-size="14">在窄窗口中，AI 正文仍保持完整宽度，</text>
    <text x="76" y="327" fill="#22302a" font-family="Segoe UI, Microsoft YaHei" font-size="14">导航与 Inspector 不会同时挤压对话区域。</text>
    <rect x="76" y="354" width="322" height="38" rx="9" fill="#f0f4f2"/><text x="96" y="378" fill="#53645d" font-family="Segoe UI, Microsoft YaHei" font-size="11">✓ 已完成 3 项操作</text><text x="378" y="378" text-anchor="end" fill="#17755a" font-family="Segoe UI, Microsoft YaHei" font-size="10">展开 ›</text>
    <text x="76" y="422" fill="#7a867f" font-family="Segoe UI, Microsoft YaHei" font-size="10">已处理 8.4 秒</text>

    <rect x="20" y="766" width="760" height="112" rx="16" fill="#ffffff" stroke="#cbd6d0" filter="url(#s)"/>
    <rect x="34" y="778" width="88" height="24" rx="8" fill="#e7f1ec"/><text x="78" y="794" text-anchor="middle" fill="#53645d" font-family="Segoe UI, Microsoft YaHei" font-size="9">README.md ×</text>
    <text x="38" y="827" fill="#89938d" font-family="Segoe UI, Microsoft YaHei" font-size="13">输入消息…</text>
    <rect x="34" y="840" width="30" height="26" rx="8" fill="#f0f4f2"/><text x="49" y="858" text-anchor="middle" fill="#53645d" font-family="Segoe UI, Microsoft YaHei" font-size="15">＋</text>
    <rect x="730" y="834" width="36" height="36" rx="11" fill="#17755a"/><path d="M741 852h13m0 0-5-5m5 5-5 5" stroke="#fff" stroke-width="2" fill="none"/>
  </g>

  <g transform="translate(900 160)">
    <rect width="250" height="260" rx="14" fill="#ffffff" stroke="#ccd6d0" filter="url(#s)"/>
    <text x="18" y="32" fill="#203029" font-family="Segoe UI, Microsoft YaHei" font-size="12" font-weight="600">Drawer 规则</text>
    <text x="18" y="66" fill="#5e6b64" font-family="Segoe UI, Microsoft YaHei" font-size="11">• 左右面板同一时间最多一个</text>
    <text x="18" y="96" fill="#5e6b64" font-family="Segoe UI, Microsoft YaHei" font-size="11">• Escape 关闭并恢复 trigger focus</text>
    <text x="18" y="126" fill="#5e6b64" font-family="Segoe UI, Microsoft YaHei" font-size="11">• Drawer 不遮挡 Composer 主按钮</text>
    <text x="18" y="156" fill="#5e6b64" font-family="Segoe UI, Microsoft YaHei" font-size="11">• 无 body 横向滚动</text>
    <text x="18" y="186" fill="#5e6b64" font-family="Segoe UI, Microsoft YaHei" font-size="11">• 用户消息最大宽度 88%</text>
    <text x="18" y="216" fill="#5e6b64" font-family="Segoe UI, Microsoft YaHei" font-size="11">• Composer 工具可换行</text>
  </g>
  <line x1="888" y1="286" x2="836" y2="286" stroke="#53645d" stroke-width="1.5" marker-end="url(#a)"/>

  <g transform="translate(900 470)">
    <rect width="250" height="220" rx="14" fill="#ffffff" stroke="#ccd6d0"/>
    <text x="18" y="34" fill="#203029" font-family="Segoe UI, Microsoft YaHei" font-size="12" font-weight="600">可用宽度</text>
    <text x="18" y="70" fill="#5e6b64" font-family="Segoe UI, Microsoft YaHei" font-size="11">Viewport：800px</text>
    <text x="18" y="99" fill="#5e6b64" font-family="Segoe UI, Microsoft YaHei" font-size="11">Conversation padding：24px</text>
    <text x="18" y="128" fill="#5e6b64" font-family="Segoe UI, Microsoft YaHei" font-size="11">Composer：760px</text>
    <text x="18" y="157" fill="#5e6b64" font-family="Segoe UI, Microsoft YaHei" font-size="11">Assistant avatar：24px</text>
    <text x="18" y="186" fill="#5e6b64" font-family="Segoe UI, Microsoft YaHei" font-size="11">正文最小字号：14px</text>
  </g>
</svg>
